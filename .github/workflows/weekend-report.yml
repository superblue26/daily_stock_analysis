name: Weekend Deep Finance Report

on:
  schedule:
    # 北京时间周六、周日 09:00 和 21:00（对应 UTC 01:00 和 13:00）
    - cron: "0 1,13 * * 6,0"
  workflow_dispatch:

jobs:
  weekend-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai

      - name: Generate and Push Weekend Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python .github/scripts/weekend_report.py
